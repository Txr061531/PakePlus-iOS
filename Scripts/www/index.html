<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>登录 · 应用系统开发交付平台</title>
    <link rel="stylesheet" href="css/app.css" />
</head>
<body class="auth-body">
    <div class="auth-card">
    <section class="auth-side">
        <div>
            <div class="logo">ADP</div>
            <h1>应用系统开发<br />交付平台</h1>
            <p>从任务、数据库、截图、报告到交付包，一处填写，全程可用。<br />账号、任务、数据库设计、截图与交付包统一管理。</p>
            <ul>
                <li>学号登录，学生初始密码为学号后 6 位</li>
                <li>手机端与桌面端共用同一套页面</li>
                <li>任务、上传、日志保存后不会丢失</li>
            </ul>
        </div>
        <div style="font-size:11px;color:#8297b6">课程设计 · 网页版</div>
    </section>
    <section class="auth-form">
        <h2>账号登录</h2>
        <p class="sub">请输入学号与密码。管理员可使用管理员账号登录。</p>
        <form method="post" action="#">
            
            <input type="hidden" name="returnUrl" />
            <div class="form-row">
                <label for="userId">账号（学号）</label>
                <input class="input" id="userId" name="userId" autocomplete="username" spellcheck="false" placeholder="例如 GZ25207113" />
            </div>
            <div class="form-row">
                <label for="password">密码</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="学生初始密码为学号后 6 位" />
            </div>
            <button class="btn block" type="submit">登 录</button>
        <input name="__RequestVerificationToken" type="hidden" value="CfDJ8GI5MbA2IttPhzmZL1OM6yDffD1FzeMkiuOkRy09PCO-a9RC1zyl2vESU-8_fH3ctTGq31xA8M_0zZDXlmcii0gtxc31iEyiZHbTsyht4BKE0G8CQeXrv5vDh6wD-RnjPcii8jPVMeTugXb-x2mpNA4" /></form>
        <div class="auth-note">
            学生账号来自本班名单；管理员账号为 <b>藤星冉.</b>。<br />
            登录状态保留 7 天，可在右上角退出。
        </div>
    </section>
</div>

    <script src="/js/app.js?v=DO-RU3vuC2Qgq7tnmj0dfQ67GCduT1DGSq0FjnyDDz8"></script>

<script>
(function(){
  var ADMIN_USER='藤星冉.', ADMIN_PASS='Xs@310614';
  var form=document.querySelector('form');
  if(!form) return;
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var u=(form.querySelector('input[name=userId]')||{}).value||'';
    var p=(form.querySelector('input[name=password]')||{}).value||'';
    u=u.trim();
    var ok=false, role='student';
    if(u===ADMIN_USER){ ok=(p===ADMIN_PASS); role='admin'; }
    else if(u.length>0 && p.length>0){ ok=true; role='student'; }
    if(!ok){
      var err=document.querySelector('.auth-error');
      if(!err){ err=document.createElement('div'); err.className='auth-error'; var first=form.querySelector('.auth-error')||form.firstChild; form.insertBefore(err,form.firstChild); }
      err.textContent='账号或密码不正确';
      return;
    }
    try{
      localStorage.setItem('adp_session', JSON.stringify({user:u, role:role, ts:Date.now()}));
      localStorage.setItem('adp_username', u);
      localStorage.setItem('adp_role', role);
    }catch(e){}
    location.href='app/index.html?u='+encodeURIComponent(u)+'&r='+role;
  });
})();
</script>
</body>
</html>
